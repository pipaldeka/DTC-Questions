<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drone MCQ Test</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --tx: #14181f;
      --mut: #667085;
      --bd: #e3e6eb;
      --ac: #2563eb;
      --ok: #16a34a;
      --okb: #dcfce7;
      --no: #dc2626;
      --nob: #fee2e2;
      --selb: #dbeafe;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115;
        --card: #181b22;
        --tx: #eceef2;
        --mut: #98a2b3;
        --bd: #2a2f3a;
        --ac: #6b9bff;
        --ok: #4ade80;
        --okb: #12301d;
        --no: #f87171;
        --nob: #3a1717;
        --selb: #1b2a4a
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #181b22;
      --tx: #eceef2;
      --mut: #98a2b3;
      --bd: #2a2f3a;
      --ac: #6b9bff;
      --ok: #4ade80;
      --okb: #12301d;
      --no: #f87171;
      --nob: #3a1717;
      --selb: #1b2a4a
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    #root {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px
    }

    h1 {
      font-size: 22px;
      margin: 0 0 4px
    }

    h2 {
      font-size: 18px;
      margin: 0 0 12px
    }

    .mut {
      color: var(--mut);
      font-size: 14px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .btn {
      background: var(--ac);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 600
    }

    .btn.sec {
      background: transparent;
      color: var(--tx);
      border: 1px solid var(--bd)
    }

    .btn:disabled {
      opacity: .4;
      cursor: default
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .chip {
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      border-radius: 999px;
      padding: 8px 14px
    }

    .chip.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .opt {
      display: flex;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px
    }

    .opt.sel {
      background: var(--selb);
      border-color: var(--ac)
    }

    .opt.ok {
      background: var(--okb);
      border-color: var(--ok)
    }

    .opt.no {
      background: var(--nob);
      border-color: var(--no)
    }

    .L {
      font-weight: 700;
      min-width: 20px
    }

    .bar {
      height: 6px;
      background: var(--bd);
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0 14px
    }

    .bar>div {
      height: 100%;
      background: var(--ac)
    }

    .pal {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 6px
    }

    .pal button {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      font-size: 13px
    }

    .pal .a {
      background: var(--selb);
      border-color: var(--ac)
    }

    .pal .c {
      outline: 2px solid var(--ac)
    }

    .pal .ok {
      background: var(--okb);
      border-color: var(--ok)
    }

    .pal .no {
      background: var(--nob);
      border-color: var(--no)
    }

    .big {
      font-size: 48px;
      font-weight: 800;
      line-height: 1
    }

    .q {
      font-size: 18px;
      font-weight: 600
    }

    label.sw {
      display: flex;
      gap: 8px;
      align-items: center
    }
  </style>
</head>

y", "Military use"], "a": 1, "t": "Drone Tech MCQs" }, { "q": "Which part of a BLDC motor provides the magnetic field?", "o": ["Copper Windings", "Stator Core", "Permanent Magnets", "Hall Effect Sensor"], "a": 2, "t": "Drone Tech MCQs" }, { "q": "The Hall Effect Sensor in a BLDC motor is used to:", "o": ["Measure temperature", "Detect rotor position for commutation", "Regulate voltage", "Measure thrust"], "a": 1, "t": "Drone Tech MCQs" }, { "q": "In Fleming's Left Hand Rule, the thumb represents:", "o": ["Direction of Current", "Direction of Magnetic Field", "Direction of Motion/Force", "Direction of Voltage"], "a": 2, "t": "Drone Tech MCQs" }, { "q": "What does the Power Module connect to distribute power?", "o": ["ESC and GPS", "Battery and distributes power to PDB and Flight Controller", "Receiver and Transmitter", "Camera and Telemetry"], "a": 1, "t": "Drone Tech MCQs" }, { "q": "What is the function of a barometer in a drone?", "o": ["Measure wind speed", "Measure atmospheric pressure to estimate altitude", "Detect magnetic north", "Calculate ground speed"], "a": 1, "t": "Drone Tech MCQs" }, { "q": "A magnetometer in a drone's flight controller detects:", "o": ["Acceleration", "Angular velocity", "Magnetic fields to determine heading", "Air pressure"], "a": 2, "t": "Drone Tech MCQs" }, { "q": "Which sensor measures linear acceleration in multiple directions?", "o": ["Gyroscope", "Magnetometer", "Barometer", "Accelerometer"], "a": 3, "t": "Drone Tech MCQs" }, { "q": "Which sensor measures angular velocity in a flight controller?", "o": ["Accelerometer", "GPS", "Gyroscope", "Barometer"], "a": 2, "t": "Drone Tech MCQs" }, { "q": "What type of current does a brushed DC motor use?", "o": ["AC only", "DC with commutator and brushes", "Three-phase AC", "Pulsed DC without brushes"], "a": 1, "t": "Drone Tech MCQs" }, { "q": "In a BLDC motor, the stator contains:", "o": ["Permanent magnets", "Copper windings", "Hall sensors only", "Carbon brushes"], "a": 1, "t": "Drone T   <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const LET = "ABCD";
    const SPEC = ["Evolution & Types", "Principles of Flight", "DGCA Rules", "Applications", "Drone Operations"];
    const secOf = t => t === "NCC Drone SOP" ? "SOP" : t === "Drone Tech MCQs" ? "Tech" : SPEC.includes(t) ? "Special" : "Trends";
    QS.forEach(q => { q.sec = secOf(q.t) });
    const SECNAME = { SOP: "NCC Drone SOP", Tech: "Tech subject", Special: "Special subject", Trends: "Latest trends" };
    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a };
    const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

    function Setup({ onStart }) {
      const topics = useMemo(() => [...new Set(QS.map(q => q.t))], []);
      const [sel, setSel] = useState(topics);
      const pool = useMemo(() => QS.filter(q => sel.includes(q.t)), [sel]);
      const total = pool.length;
      const [n, setN] = useState(25);
      useEffect(() => { if (n > total && total > 0) setN(total) }, [total]);
      const [shuf, setShuf] = useState(true);
      const [practice, setPractice] = useState(false);
      const [timed, setTimed] = useState(false);
      const sizes = [10, 25, 50, 100, total].filter((s, i, a) => s <= total && a.indexOf(s) === i);
      return (<div>
        <div className="card"><h1>Drone MCQ Test</h1>
          <div className="mut">{QS.length} questions across {topics.length} topics</div></div>

          <div className="mut" style={{ marginBottom: 10 }}>40 SOP + 30 Tech/Special subject + 10 Latest trends · 80 minutes · no instant feedback</div>
          <button className="btn" style={{ width: "100%" }} onClick={() => {
            const by = s => shuffle(QS.filter(q => q.sec === s));
            const tech = by("Tech").slice(0, 15), spec = by("Special").slice(0, 15);
            const qs = [...by("SOP").slice(0, 40), ...tech, ...spec, ...by("Trends").slice(0, 10)];
            onStart({ qs, practice: false, limit: 80 * 60, exam: true });
          }}>Start 80-mark mock exam</button>
        </div>
        <div className="card">
          <h2>Topics</h2>
          <div className="row">{topics.map(t => {
            const on = sel.includes(t); const c = QS.filter(q => q.t === t).length;
            return <button key={t} className={"chip" + (on ? " on" : "")} onClick={() => setSel(on ? sel.filter(x => x !== t) : [...sel, t])}>{t} ({c})</button>
          })}</div>
          <div className="row" style={{ marginTop: 8 }}>
            <button className="btn sec" onClick={() => setSel(topics)}>All</button>
            <button className="btn sec" onClick={() => setSel([])}>None</button>
            <button className="btn sec" onClick={() => setSel(topics.filter(t => t === "NCC Drone SOP"))}>SOP only</button></div>
        </div>
        <div className="card">
          <h2>Custom practice test</h2>
          <h2 style={{ fontSize: 15 }}>Number of questions</h2>
          <div className="row">{sizes.map(s =>
            <button key={s} className={"chip" + (n === s ? " on" : "")} onClick={() => setN(s)}>{s === total ? "All " + total : s}</button>)}</div>
          <h2 style={{ marginTop: 18 }}>Options</h2>
          <div className="row" style={{ flexDirection: "column", alignItems: "flex-start", gap: 10 }}>
            <label className="sw"><input type="checkbox" checked={shuf} onChange={e => setShuf(e.target.checked)} /> Shuffle questions</label>
            <label className="sw"><input type="checkbox" checked={practice} onChange={e => setPractice(e.target.checked)} /> Practice mode (instant feedback)</label>
            <label className="sw"><input type="checkbox" checked={timed} onChange={e => setTimed(e.target.checked)} /> Timer (1 min per question)</label>
          </div>
        </div>
        <button className="btn" style={{ width: "100%" }} disabled={total === 0} onClick={() => {
          const k = Math.min(n, total);
          const pick = (shuf ? shuffle(pool) : pool).slice(0, k);
          onStart({ qs: pick, practice, limit: timed ? k * 60 : 0 });
        }}>Start test</button>
      </div>);
    }

    function Test({ cfg, onFinish }) {
      const { qs, practice, limit } = cfg;
      const [i, setI] = useState(0);
      const [ans, setAns] = useState({});
      const [left, setLeft] = useState(limit);
      useEffect(() => {
        if (!limit) return;
        const t = setInterval(() => setLeft(l => l - 1), 1000);
        return () => clearInterval(t);
      }, []);
      useEffect(() => { if (limit && left <= 0) onFinish(ans) }, [left]);
      const q = qs[i];
      const picked = ans[i];
      const locked = practice && picked !== undefined;
      const answered = Object.keys(ans).length;
      const pick = k => { if (!locked) setAns({ ...ans, [i]: k }) };
      const cls = k => {
        if (locked) { if (k === q.a) return "opt ok"; if (k === picked) return "opt no"; return "opt" }
        return "opt" + (picked === k ? " sel" : "");
      };
      const palCls = j => {
        let c = j === i ? "c " : "";
        if (ans[j] !== undefined) { c += practice ? (ans[j] === qs[j].a ? "ok" : "no") : "a" }
        return c;
      };
      const finish = () => {
        if (answered < qs.length && !confirm((qs.length - answered) + " question(s) unanswered. Submit anyway?")) return;
        onFinish(ans);
      };
      return (<div>
        <div className="card">
          <div className="row" style={{ justifyContent: "space-between" }}>
            <span className="mut">{cfg.exam ? SECNAME[q.sec] + " · " : ""}Question {i + 1} of {qs.length} · {answered} answered</span>
            {limit > 0 && <b style={{ color: left < 60 ? "var(--no)" : "inherit" }}>{fmt(Math.max(left, 0))}</b>}
          </div>
          <div className="bar"><div style={{ width: ((i + 1) / qs.length * 100) + "%" }} /></div>
          <div className="q">{q.q}</div>
          {q.o.map((o, k) => <button key={k} className={cls(k)} onClick={() => pick(k)}>
            <span className="L">{LET[k]}</span><span>{o}</span></button>)}
        </div>
        <div className="row" style={{ justifyContent: "space-between", marginBottom: 14 }}>
          <button className="btn sec" disabled={i === 0} onClick={() => setI(i - 1)}>← Prev</button>
          {i < qs.length - 1
            ? <button className="btn" onClick={() => setI(i + 1)}>Next →</button>
            : <button className="btn" onClick={finish}>Submit</button>}
        </div>
        <div className="card"><div className="mut" style={{ marginBottom: 8 }}>Jump to</div>
          <div className="pal">{qs.map((_, j) => <button key={j} className={palCls(j)} onClick={() => setI(j)}>{j + 1}</button>)}</div>
          <div className="row" style={{ marginTop: 12 }}><button className="btn sec" onClick={finish}>Finish test</button></div>
        </div>
      </div>);
    }

    function Result({ cfg, ans, onRetry, onHome }) {
      const { qs } = cfg;
      const correct = qs.filter((q, i) => ans[i] === q.a).length;
      const skipped = qs.filter((_, i) => ans[i] === undefined).length;
      const wrong = qs.length - correct - skipped;
      const pct = Math.round(correct / qs.length * 100);
      const [filter, setFilter] = useState("wrong");
      const rows = qs.map((q, i) => ({ q, i })).filter(({ q, i }) => filter === "all" || ans[i] !== q.a);
      return (<div>
        <div className="card" style={{ textAlign: "center" }}>
          <div className="big">{pct}%</div>
          <div style={{ margin: "8px 0" }}>{correct} / {qs.length} correct</div>
          <div className="mut">{wrong} wrong · {skipped} skipped</div>
          <div className="row" style={{ justifyContent: "center", marginTop: 14 }}>
            <button className="btn" onClick={onRetry}>Retake same set</button>
            <button className="btn sec" onClick={onHome}>New test</button>
          </div>
        </div>
        {cfg.exam && <div className="card"><h2>Section-wise marks</h2>
          {["SOP", "Tech", "Special", "Trends"].map(s => {
            const idx = qs.map((q, i) => i).filter(i => qs[i].sec === s); const c = idx.filter(i => ans[i] === qs[i].a).length;
            return <div key={s} className="row" style={{ justifyContent: "space-between", padding: "4px 0" }}><span>{SECNAME[s]}</span><b>{c} / {idx.length}</b></div>
          })}
          <div className="row" style={{ justifyContent: "space-between", borderTop: "1px solid var(--bd)", paddingTop: 8, marginTop: 4 }}><span>Total</span><b>{correct} / {qs.length}</b></div></div>}
        <div className="row" style={{ marginBottom: 12 }}>
          <button className={"chip" + (filter === "wrong" ? " on" : "")} onClick={() => setFilter("wrong")}>Missed ({wrong + skipped})</button>
          <button className={"chip" + (filter === "all" ? " on" : "")} onClick={() => setFilter("all")}>All</button>
        </div>
        {rows.length === 0 && <div className="card">Nothing missed. 🎯</div>}
        {rows.map(({ q, i }) => <div className="card" key={i}>
          <div className="mut">Q{i + 1}</div>
          <div className="q">{q.q}</div>
          {q.o.map((o, k) => <div key={k} className={"opt" + (k === q.a ? " ok" : (k === ans[i] ? " no" : ""))}>
            <span className="L">{LET[k]}</span><span>{o}</span></div>)}
          {ans[i] === undefined && <div className="mut" style={{ marginTop: 8 }}>Skipped</div>}
        </div>)}
      </div>);
    }

    function App() {
      const [stage, setStage] = useState("setup");
      const [cfg, setCfg] = useState(null);
      const [ans, setAns] = useState({});
      const [run, setRun] = useState(0);
      if (stage === "setup") return <Setup onStart={c => { setCfg(c); setRun(r => r + 1); setStage("test") }} />;
      if (stage === "test") return <Test key={run} cfg={cfg} onFinish={a => { setAns(a); setStage("result"); window.scrollTo(0, 0) }} />;
      return <Result cfg={cfg} ans={ans} onHome={() => setStage("setup")} onRetry={() => { setRun(r => r + 1); setStage("test"); window.scrollTo(0, 0) }} />;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
